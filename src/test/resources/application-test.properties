spring.application.name=boltfood

spring.liquibase.change-log=db/changelog/db.changelog-master.xml

spring.datasource.url=jdbc:h2:mem:boltfood-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=ADMIN
spring.datasource.password=ADMIN

spring.jpa.hibernate.ddl-auto=none
spring.liquibase.default-schema=PUBLIC

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

weather.api.url=https://www.ilmateenistus.ee/ilma_andmed/xml/observations.php
weather.import.cron=0 15 * * * *

http.connection-timeout-ms=5000
http.read-timeout-ms=20000